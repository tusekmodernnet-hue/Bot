[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cqs"
version = "0.1.0"
description = "Crypto Quant System: research, validation and paper trading of crypto futures strategies"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cqs = "cqs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that download data from the internet"]
